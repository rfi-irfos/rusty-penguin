set timeout=3
set default=1
set gfxpayload=800x600x32,800x600

menuentry "Rusty Penguin v1.0.0" {
    linux /boot/vmlinuz quiet loglevel=0 console=tty0 init=/init rw
    initrd /boot/initrd.img
}

menuentry "Rusty Penguin (bare metal)" {
    set gfxpayload=keep
    multiboot2 /boot/kernel.elf
    module2    /boot/initrd-bare.img initrd
    boot
}
