[workspace]
resolver = "2"
members = [
    "ternary-core",
    "mathematics",
    "hardware-abstraction",
    "ai-runtime",
    "scheduler",
    "shell",
    "init",
    "desktop",
    "kernel",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Simeon", "Gemini CLI Agent"]
license = "MIT"
repository = "https://github.com/eri-irfos/rusty-penguin"
description = "Ternary-first operating system powered by Rust."

[workspace.dependencies]
# Future common dependencies
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
