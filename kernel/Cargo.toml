[package]
name = "rusty-penguin-kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kernel"
path = "src/main.rs"

[dependencies]
ternary-core          = { path = "../ternary-core" }
mathematics           = { path = "../mathematics" }
hardware-abstraction  = { path = "../hardware-abstraction" }
ai-runtime            = { path = "../ai-runtime" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
strip = false
