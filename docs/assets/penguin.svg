<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- body -->
  <ellipse cx="32" cy="38" rx="18" ry="22" fill="#1e293b"/>
  <!-- white belly -->
  <ellipse cx="32" cy="42" rx="11" ry="15" fill="#f1f5f9"/>
  <!-- head -->
  <circle cx="32" cy="16" r="12" fill="#1e293b"/>
  <!-- left eye -->
  <circle cx="27" cy="13" r="2.5" fill="#f8fafc"/>
  <circle cx="27.8" cy="13" r="1.2" fill="#0f172a"/>
  <!-- right eye -->
  <circle cx="37" cy="13" r="2.5" fill="#f8fafc"/>
  <circle cx="37.8" cy="13" r="1.2" fill="#0f172a"/>
  <!-- beak -->
  <polygon points="32,18 28,22 36,22" fill="#f59e0b"/>
  <!-- feet -->
  <ellipse cx="24" cy="59" rx="7" ry="3" fill="#f59e0b"/>
  <ellipse cx="40" cy="59" rx="7" ry="3" fill="#f59e0b"/>
  <!-- wings -->
  <ellipse cx="13" cy="40" rx="5" ry="12" fill="#0f172a" transform="rotate(-10 13 40)"/>
  <ellipse cx="51" cy="40" rx="5" ry="12" fill="#0f172a" transform="rotate(10 51 40)"/>
  <!-- ternary trit marks on belly — subtle -->
  <text x="32" y="41" font-family="monospace" font-size="6" fill="#475569" text-anchor="middle">+1 0 -1</text>
</svg>
